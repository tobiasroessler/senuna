[project]
name = "senuna"
version = "0.1.0"
description = "Senuna is a lightweight BPMN 2.0 workflow engine for Python"
readme = "README.md"
authors = [
    { name = "Tobias Roessler", email = "tobiasroessler@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# An xfail test that starts passing counts as a failure, so the marker gets removed
xfail_strict = true

[tool.ruff.lint]
# Defaults (E, F) plus warnings, import sorting, bug patterns, modern syntax, simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src", "tests", "examples"]
strict = true
